#cloud-config
# Provisions a fresh Ubuntu droplet for the tennis arbitrage bot.
# Installs Python + Docker + creates the unprivileged service user.
# The actual project files, .env, and sessions.jsonl are uploaded by
# deploy.sh after this runs. Docker hosts the Nitter + Redis stack
# that the bot's XSource talks to over localhost:8080.

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-venv
  - python3-pip
  - build-essential
  - git
  - curl
  - ca-certificates
  - docker.io
  - docker-compose-v2

users:
  - name: bot
    system: true
    shell: /usr/sbin/nologin
    create_home: false

runcmd:
  - mkdir -p /opt/tennis-arb-bot
  - chown -R bot:bot /opt/tennis-arb-bot
  - chmod 750 /opt/tennis-arb-bot
  - systemctl enable --now docker
